name: Lint workflows

on:
  pull_request:
    paths:
      - ".github/workflows/**"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reports actionlint (and shellcheck) findings as PR annotations
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          fail_level: error
